services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # 只綁定在主機本機（127.0.0.1），不對外開放資料庫；要用 DB 工具連線請在主機上操作或用 SSH 通道。
    # 埠被佔用時 deploy.sh 會自動換一個並寫進 .env 的 DB_HOST_PORT
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\" || mysqladmin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./server
    restart: unless-stopped
    environment: &server_env
      TZ: Asia/Taipei
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-none}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_FROM: ${SMTP_FROM}
      NOTIFICATION_TO_EMAILS: ${NOTIFICATION_TO_EMAILS}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_OAUTH_USER: ${SMTP_OAUTH_USER}
      SMTP_OAUTH_CLIENT_ID: ${SMTP_OAUTH_CLIENT_ID}
      SMTP_OAUTH_CLIENT_SECRET: ${SMTP_OAUTH_CLIENT_SECRET}
      SMTP_OAUTH_REFRESH_TOKEN: ${SMTP_OAUTH_REFRESH_TOKEN}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  # 每天自動備份資料庫與請假附件到主機的 ./backups，並可上傳到 NAS 的 SMB 資料夾
  # （系統設定 → 備份；見 server/backupWorker.js 與 DEPLOY.md「資料備份與還原」）
  backup:
    build: ./server
    restart: unless-stopped
    init: true
    command: ["node", "backupWorker.js"]
    environment:
      <<: *server_env
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads_data:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
