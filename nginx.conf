# 真實使用者 IP：經過 Cloudflare（含 Cloudflare Tunnel）時，Cloudflare 會帶 CF-Connecting-IP，
# 沒有這個標頭（區網直連）就用連線來源。直接覆寫 X-Forwarded-For，避免使用者自己帶假的標頭。
# 否則 Docker 轉送後來源會變成閘道位址（如 172.18.0.1），操作紀錄與打卡 IP 限制都會失準
map $http_cf_connecting_ip $real_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
